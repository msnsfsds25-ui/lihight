<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>파스텔 가챠 머신</title>

  <!-- =================================================================
       [1] 카카오톡 공유 미리보기 설정 (원하는 내용으로 수정하세요)
       ================================================================= -->
  <meta property="og:title" content="두근두근 파스텔 가챠 뽑기!" />
  <meta property="og:description" content="동전을 넣고 손잡이를 돌려 오늘의 행운 캡슐을 뽑아보세요!" />
  <meta property="og:image" content="https://placehold.co/800x400/ffd6e7/7a4b63?text=Pastel+Gacha" />

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(160deg, #fff3f8 0%, #f3efff 55%, #eaf6ff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 14px 40px;
      color: #5a4659;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* 가챠 머신 본체 */
    .gacha-machine {
      background: #ffffff;
      border-radius: 36px;
      padding: 18px;
      border: 4px solid #ffd5e7;
      box-shadow: 0 16px 36px rgba(205, 160, 195, 0.25);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 상단 포스터 */
    .poster-frame {
      width: 100%;
      aspect-ratio: 16 / 7;
      border-radius: 22px;
      overflow: hidden;
      border: 3px solid #ffc4de;
      background: linear-gradient(135deg, #ffe3ef, #e8e3ff);
    }

    .poster-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 캡슐 돔 */
    .dome {
      position: relative;
      width: 100%;
      height: 220px;
      border-radius: 30px;
      background: radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.95), rgba(236, 246, 255, 0.78) 68%, rgba(224, 217, 255, 0.85));
      border: 4px solid #d7cfff;
      overflow: hidden;
      box-shadow: inset 0 -12px 22px rgba(180, 168, 240, 0.22);
    }

    .dome-shine {
      position: absolute;
      top: 14px;
      left: 20px;
      width: 72px;
      height: 22px;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 50%;
      transform: rotate(-16deg);
      pointer-events: none;
      z-index: 2;
    }

    .dome-capsules {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .mini-capsule {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 4px 8px rgba(135, 115, 155, 0.16);
    }

    .mini-capsule::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2.5px;
      background: rgba(255, 255, 255, 0.9);
      transform: translateY(-50%);
    }

    .dome.shaking .mini-capsule {
      animation: shakeCapsules 0.35s ease-in-out infinite alternate;
    }

    @keyframes shakeCapsules {
      0% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(-5px, -12px) rotate(-22deg); }
      100% { transform: translate(5px, -7px) rotate(22deg); }
    }

    /* 상태 메시지 */
    .guide-text {
      background: #fff4f8;
      border: 2px dashed #ffb7d3;
      border-radius: 16px;
      padding: 10px 12px;
      text-align: center;
      font-size: 13.5px;
      font-weight: 700;
      color: #9e5274;
    }

    /* 하단 조작부: 코인투입구 | 손잡이 | 배출구 (겹침 없이 배치) */
    .bottom-deck {
      background: linear-gradient(180deg, #ffeaf2 0%, #ffd8e8 100%);
      border-radius: 26px;
      padding: 16px 12px;
      border: 3px solid #ffbdd9;
      display: grid;
      grid-template-columns: 92px 1fr 104px;
      align-items: center;
      gap: 10px;
    }

    .deck-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .deck-tag {
      font-size: 11px;
      font-weight: 800;
      color: #8b516c;
      background: rgba(255, 255, 255, 0.85);
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .coin-btn {
      width: 78px;
      height: 102px;
      background: #ffffff;
      border: 3px solid #f4a6c6;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 5px 0 #ed93b8;
    }

    .coin-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #ed93b8;
    }

    .coin-slot {
      width: 11px;
      height: 42px;
      background: #583948;
      border-radius: 999px;
      border: 2px solid #d685a7;
    }

    .coin-label {
      font-size: 12px;
      font-weight: 800;
      color: #b1527b;
    }

    .dial-btn {
      width: 122px;
      height: 122px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff, #ffe2ee);
      border: 5px solid #ff9bc4;
      box-shadow: 0 7px 0 #ea81ae, 0 10px 16px rgba(185, 90, 134, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .dial-btn.spinning {
      transform: rotate(360deg);
    }

    .dial-handle {
      width: 94px;
      height: 28px;
      background: linear-gradient(180deg, #ff84b6, #f2639f);
      border-radius: 999px;
      border: 3px solid #ffffff;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chute-box {
      width: 94px;
      height: 102px;
      background: #6a4b63;
      border-radius: 20px;
      border: 4px solid #f4a6c6;
      box-shadow: inset 0 10px 16px rgba(30, 16, 28, 0.52);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .chute-capsule {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      display: none;
      position: relative;
      animation: capsuleDrop 0.45s cubic-bezier(0.28, 1.45, 0.5, 1) forwards;
    }

    .chute-capsule::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.92);
      transform: translateY(-50%);
    }

    .chute-capsule.visible {
      display: block;
    }

    @keyframes capsuleDrop {
      0% { transform: translateY(-65px) scale(0.75); opacity: 0; }
      75% { transform: translateY(5px) scale(1.04); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* 내 보관함 영역 */
    .inventory-section {
      background: #ffffff;
      border-radius: 28px;
      padding: 18px;
      border: 3px solid #e3dcff;
      box-shadow: 0 10px 24px rgba(175, 160, 215, 0.16);
    }

    .inventory-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .inventory-title {
      font-size: 16px;
      font-weight: 800;
      color: #5b476e;
    }

    .inventory-count {
      font-size: 12px;
      font-weight: 800;
      color: #7d5fd3;
      background: #f2eeff;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .inventory-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 22px 10px;
      font-size: 13px;
      color: #9687a6;
      background: #faf8ff;
      border-radius: 16px;
    }

    .inv-item {
      background: #faf8ff;
      border: 2px solid #ebe4ff;
      border-radius: 16px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .inv-item img {
      width: 68px;
      height: 68px;
      object-fit: contain;
      border-radius: 12px;
      background: #ffffff;
    }

    .inv-item span {
      font-size: 11.5px;
      font-weight: 700;
      color: #5a4659;
      text-align: center;
      line-height: 1.25;
      word-break: keep-all;
    }

    /* 결과 팝업 모달 */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(62, 42, 62, 0.55);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 200;
    }

    .modal-bg.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 340px;
      background: #ffffff;
      border-radius: 28px;
      padding: 22px 20px;
      text-align: center;
      border: 4px solid #ffc7de;
      box-shadow: 0 18px 40px rgba(75, 42, 70, 0.28);
    }

    .modal-badge {
      display: inline-block;
      background: #fff0f6;
      color: #d44984;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .modal-img-box {
      width: 190px;
      height: 190px;
      margin: 0 auto 14px;
      border-radius: 20px;
      background: #faf7ff;
      border: 2px solid #ece4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .modal-img-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .modal-reward-name {
      font-size: 19px;
      font-weight: 800;
      color: #4d374c;
      margin-bottom: 16px;
      word-break: keep-all;
    }

    .modal-close {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 15px;
      background: linear-gradient(135deg, #ff89b8, #b69aff);
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 가챠 기계 -->
    <div class="gacha-machine">
      <div class="poster-frame">
        <img id="posterImg" src="" alt="가챠 포스터" />
      </div>

      <div class="dome" id="dome">
        <div class="dome-shine"></div>
        <div class="dome-capsules" id="domeCapsules"></div>
      </div>

      <div class="guide-text" id="guideText">왼쪽 코인 투입구를 눌러 코인을 넣어주세요!</div>

      <div class="bottom-deck">
        <div class="deck-slot">
          <span class="deck-tag">1. 코인 투입</span>
          <button type="button" class="coin-btn" id="coinBtn">
            <div class="coin-slot"></div>
            <span class="coin-label" id="coinLabel">0 코인</span>
          </button>
        </div>

        <div class="deck-slot">
          <span class="deck-tag">2. 손잡이 돌리기</span>
          <button type="button" class="dial-btn" id="dialBtn" aria-label="손잡이 돌리기">
            <div class="dial-handle">TURN</div>
          </button>
        </div>

        <div class="deck-slot">
          <span class="deck-tag">3. 캡슐 열기</span>
          <div class="chute-box" id="chuteBox" role="button" tabindex="0" aria-label="배출구 캡슐 열기">
            <div class="chute-capsule" id="chuteCapsule"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 친구/사용자 본인이 뽑은 상품 보관함 -->
    <section class="inventory-section">
      <div class="inventory-header">
        <h2 class="inventory-title">🎒 내 보관함</h2>
        <span class="inventory-count" id="inventoryCount">0개</span>
      </div>
      <div class="inventory-grid" id="inventoryGrid">
        <div class="inventory-empty">아직 뽑은 캡슐이 없어요. 가챠를 돌려보세요!</div>
      </div>
    </section>
  </div>

  <!-- 결과 확인 팝업 -->
  <div class="modal-bg" id="modalBg">
    <div class="modal-box">
      <span class="modal-badge">✨ 획득 완료!</span>
      <div class="modal-img-box">
        <img id="modalImg" src="" alt="상품 이미지" />
      </div>
      <div class="modal-reward-name" id="modalRewardName">상품명</div>
      <button type="button" class="modal-close" id="modalClose">확인</button>
    </div>
  </div>

  <script>
    /* =================================================================
       [2] 상단 포스터 & 가챠 상품 설정 (여기서 수정하면 공유 시에도 적용됩니다)
       ================================================================= */

    // 상단 포스터 이미지 주소
    const POSTER_URL = "https://placehold.co/800x350/ffd6e7/7a4b63?text=MY+PASTEL+GACHA";

    // 가챠 상품 목록 (name: 상품명, img: 결과 이미지 주소)
    const REWARDS = [
      {
        name: "딸기 우유 키링",
        img: "https://placehold.co/400x400/ffdce8/7a4b63?text=Reward+1"
      },
      {
        name: "라벤더 구름 스티커",
        img: "https://placehold.co/400x400/e5dcff/594a7a?text=Reward+2"
      },
      {
        name: "소다 캔디 아크릴 스탠드",
        img: "https://placehold.co/400x400/d9f2ff/3d647a?text=Reward+3"
      },
      {
        name: "레몬 푸딩 배지",
        img: "https://placehold.co/400x400/fff5cc/7a6a38?text=Reward+4"
      }
    ];

    /* =================================================================
       [3] 가챠 동작 & 도르륵 소리 & 보관함 로직
       ================================================================= */
    const CAPSULE_COLORS = [
      "linear-gradient(180deg, #ff9ec6 50%, #ffffff 50%)",
      "linear-gradient(180deg, #b8a6ff 50%, #ffffff 50%)",
      "linear-gradient(180deg, #8fd8ff 50%, #ffffff 50%)",
      "linear-gradient(180deg, #ffe08a 50%, #ffffff 50%)",
      "linear-gradient(180deg, #9ce8c8 50%, #ffffff 50%)"
    ];

    let coins = 0;
    let isSpinning = false;
    let pendingItem = null;
    let collectedItems = [];

    const posterImg = document.getElementById("posterImg");
    const dome = document.getElementById("dome");
    const domeCapsules = document.getElementById("domeCapsules");
    const guideText = document.getElementById("guideText");
    const coinBtn = document.getElementById("coinBtn");
    const coinLabel = document.getElementById("coinLabel");
    const dialBtn = document.getElementById("dialBtn");
    const chuteBox = document.getElementById("chuteBox");
    const chuteCapsule = document.getElementById("chuteCapsule");
    const inventoryCount = document.getElementById("inventoryCount");
    const inventoryGrid = document.getElementById("inventoryGrid");
    const modalBg = document.getElementById("modalBg");
    const modalImg = document.getElementById("modalImg");
    const modalRewardName = document.getElementById("modalRewardName");
    const modalClose = document.getElementById("modalClose");

    posterImg.src = POSTER_URL;

    function initDomeCapsules() {
      domeCapsules.innerHTML = "";
      const coords = [
        { left: "8%", bottom: "10px", rot: -15 },
        { left: "22%", bottom: "14px", rot: 18 },
        { left: "37%", bottom: "8px", rot: -10 },
        { left: "52%", bottom: "15px", rot: 28 },
        { left: "67%", bottom: "10px", rot: -22 },
        { left: "81%", bottom: "14px", rot: 12 },
        { left: "15%", bottom: "48px", rot: 24 },
        { left: "31%", bottom: "52px", rot: -16 },
        { left: "47%", bottom: "46px", rot: 14 },
        { left: "62%", bottom: "50px", rot: -25 },
        { left: "76%", bottom: "46px", rot: 20 },
        { left: "24%", bottom: "84px", rot: -12 },
        { left: "42%", bottom: "86px", rot: 22 },
        { left: "58%", bottom: "82px", rot: -18 }
      ];

      coords.forEach((c, i) => {
        const el = document.createElement("div");
        el.className = "mini-capsule";
        el.style.left = c.left;
        el.style.bottom = c.bottom;
        el.style.transform = `rotate(${c.rot}deg)`;
        el.style.background = CAPSULE_COLORS[i % CAPSULE_COLORS.length];
        domeCapsules.appendChild(el);
      });
    }

    // 효과음 (코인 소리 / 도르륵 크랭크 소리 / 캡슐 팝 소리)
    function playSound(kind) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        if (kind === "coin") {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "sine";
          osc.frequency.setValueAtTime(987.77, now);
          osc.frequency.setValueAtTime(1318.51, now + 0.08);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (kind === "rattle") {
          // 도르륵 연속 클릭/라쳇 소리
          const clicks = 9;
          for (let i = 0; i < clicks; i++) {
            const t = now + i * 0.075;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = "triangle";
            osc.frequency.setValueAtTime(240 + i * 28, t);
            osc.frequency.exponentialRampToValueAtTime(140, t + 0.045);
            gain.gain.setValueAtTime(0.13, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
            osc.start(t);
            osc.stop(t + 0.055);
          }
        } else if (kind === "pop") {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "sine";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.36);
        }
      } catch (err) {}
    }

    function renderInventory() {
      inventoryCount.textContent = `${collectedItems.length}개`;
      if (collectedItems.length === 0) {
        inventoryGrid.innerHTML = `<div class="inventory-empty">아직 뽑은 캡슐이 없어요. 가챠를 돌려보세요!</div>`;
        return;
      }

      inventoryGrid.innerHTML = "";
      collectedItems.forEach((item) => {
        const card = document.createElement("div");
        card.className = "inv-item";
        card.innerHTML = `
          <img src="${item.img}" alt="${item.name}" />
          <span>${item.name}</span>
        `;
        card.addEventListener("click", () => {
          modalImg.src = item.img;
          modalRewardName.textContent = item.name;
          modalBg.classList.add("open");
        });
        inventoryGrid.appendChild(card);
      });
    }

    coinBtn.addEventListener("click", () => {
      if (isSpinning) return;
      coins += 1;
      coinLabel.textContent = `${coins} 코인`;
      playSound("coin");
      if (!pendingItem) {
        guideText.textContent = "가운데 손잡이(TURN)를 눌러 돌려주세요!";
      }
    });

    dialBtn.addEventListener("click", () => {
      if (isSpinning) return;

      if (pendingItem) {
        guideText.textContent = "오른쪽 배출구 캡슐을 먼저 눌러 열어주세요!";
        return;
      }

      if (coins <= 0) {
        guideText.textContent = "코인이 없어요! 왼쪽 투입구를 먼저 눌러주세요.";
        return;
      }

      coins -= 1;
      coinLabel.textContent = `${coins} 코인`;
      isSpinning = true;
      guideText.textContent = "도르륵... 캡슐이 섞이고 있어요!";
      playSound("rattle");

      dialBtn.classList.add("spinning");
      dome.classList.add("shaking");

      setTimeout(() => {
        dialBtn.classList.remove("spinning");
        dome.classList.remove("shaking");

        const picked = REWARDS[Math.floor(Math.random() * REWARDS.length)];
        pendingItem = { ...picked };

        chuteCapsule.style.background = CAPSULE_COLORS[Math.floor(Math.random() * CAPSULE_COLORS.length)];
        chuteCapsule.classList.add("visible");

        isSpinning = false;
        guideText.textContent = "캡슐이 나왔어요! 오른쪽 배출구 캡슐을 눌러보세요!";
      }, 750);
    });

    function openChuteCapsule() {
      if (!pendingItem || isSpinning) return;
      playSound("pop");

      modalImg.src = pendingItem.img;
      modalRewardName.textContent = pendingItem.name;
      modalBg.classList.add("open");

      collectedItems.unshift(pendingItem);
      renderInventory();

      chuteCapsule.classList.remove("visible");
      pendingItem = null;
      guideText.textContent = coins > 0
        ? "손잡이를 한 번 더 돌릴 수 있어요!"
        : "왼쪽 코인 투입구를 눌러 코인을 넣어주세요!";
    }

    chuteBox.addEventListener("click", openChuteCapsule);
    chuteBox.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") openChuteCapsule();
    });

    modalClose.addEventListener("click", () => {
      modalBg.classList.remove("open");
    });

    modalBg.addEventListener("click", (e) => {
      if (e.target === modalBg) {
        modalBg.classList.remove("open");
      }
    });

    initDomeCapsules();
    renderInventory();
  </script>
</body>
</html>
