<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>파스텔 가챠 머신</title>

  <!-- =================================================================
       [1] 카카오톡 공유 미리보기 설정 (여기 3줄만 원하는 내용으로 바꾸세요)
       ================================================================= -->
  <meta property="og:title" content="두근두근 파스텔 가챠 뽑기!" />
  <meta property="og:description" content="동전을 넣고 손잡이를 돌려 오늘의 행운 캡슐을 뽑아보세요!" />
  <meta property="og:image" content="https://placehold.co/800x400/ffd6e7/7a4b63?text=Pastel+Gacha" />

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #fff5f9 0%, #f3f0ff 50%, #eef7ff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 14px;
      color: #5c4b5b;
    }

    /* 전체 머신 프레임 */
    .machine-wrapper {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 36px;
      padding: 18px;
      box-shadow:
        0 18px 40px rgba(214, 168, 200, 0.28),
        inset 0 0 0 4px #ffd8e8;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 상단 포스터 영역 */
    .poster-box {
      width: 100%;
      aspect-ratio: 16 / 7;
      background: linear-gradient(135deg, #ffe2ee, #e8e4ff);
      border-radius: 22px;
      overflow: hidden;
      border: 3px solid #ffc6de;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 중앙 투명 돔(캡슐 통) */
    .dome-area {
      position: relative;
      width: 100%;
      height: 230px;
      background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.95), rgba(235, 245, 255, 0.75) 65%, rgba(224, 218, 255, 0.85));
      border-radius: 32px;
      border: 4px solid #d9d2ff;
      overflow: hidden;
      box-shadow: inset 0 -14px 24px rgba(185, 174, 245, 0.25);
    }

    .dome-highlight {
      position: absolute;
      top: 14px;
      left: 20px;
      width: 75px;
      height: 24px;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 50%;
      transform: rotate(-18deg);
      pointer-events: none;
      z-index: 3;
    }

    .capsule-pool {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .deco-capsule {
      position: absolute;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 10px rgba(140, 120, 160, 0.18);
      transition: transform 0.35s ease;
    }

    .deco-capsule::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2.5px;
      background: rgba(255, 255, 255, 0.85);
      transform: translateY(-50%);
    }

    .dome-area.shaking .deco-capsule {
      animation: capsuleMix 0.45s ease-in-out infinite alternate;
    }

    @keyframes capsuleMix {
      0% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(-6px, -14px) rotate(-25deg); }
      100% { transform: translate(6px, -8px) rotate(25deg); }
    }

    /* 상태 안내 배너 */
    .status-bar {
      background: #fff4f8;
      border: 2px dashed #ffb8d4;
      border-radius: 16px;
      padding: 10px 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: #a45779;
    }

    /* =================================================================
       하단 조작부: 코인투입구 / 가챠 손잡이 / 캡슐 배출구 (겹침 방지 3단 구조)
       ================================================================= */
    .control-panel {
      background: linear-gradient(180deg, #ffeaf2 0%, #ffd8e8 100%);
      border-radius: 26px;
      padding: 18px 14px;
      border: 3px solid #ffc0da;
      display: grid;
      grid-template-columns: 92px 1fr 104px;
      align-items: center;
      gap: 10px;
    }

    .panel-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .panel-label {
      font-size: 11px;
      font-weight: 800;
      color: #8c536d;
      background: rgba(255, 255, 255, 0.8);
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* 1) 왼쪽: 코인 투입구 */
    .coin-slot-btn {
      width: 78px;
      height: 104px;
      background: #ffffff;
      border: 3px solid #f5a9c8;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 5px 0 #ee96ba;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .coin-slot-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #ee96ba;
    }

    .coin-hole {
      width: 12px;
      height: 44px;
      background: #593a49;
      border-radius: 999px;
      border: 2px solid #d889ab;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.45);
    }

    .coin-text {
      font-size: 12px;
      font-weight: 800;
      color: #b4557e;
    }

    /* 2) 가운데: 큼직한 가챠 손잡이(다이얼) */
    .crank-btn {
      width: 124px;
      height: 124px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff, #ffe3ef);
      border: 5px solid #ff9ec6;
      box-shadow:
        0 7px 0 #eb84b0,
        0 10px 18px rgba(190, 95, 138, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .crank-btn.turning {
      transform: rotate(360deg);
    }

    .crank-bar {
      width: 96px;
      height: 28px;
      background: linear-gradient(180deg, #ff85b7, #f466a1);
      border-radius: 999px;
      border: 3px solid #ffffff;
      box-shadow: 0 3px 8px rgba(185, 68, 118, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    /* 3) 오른쪽: 큼직한 캡슐 배출구 */
    .exit-box {
      width: 94px;
      height: 104px;
      background: #6c4d65;
      border-radius: 20px;
      border: 4px solid #f5a9c8;
      box-shadow: inset 0 10px 18px rgba(32, 18, 30, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .exit-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 24px;
      background: rgba(255, 214, 232, 0.3);
      border-bottom: 2px solid rgba(255, 255, 255, 0.25);
      pointer-events: none;
    }

    .dropped-capsule {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
      display: none;
      position: relative;
      animation: dropBounce 0.5s cubic-bezier(0.28, 1.45, 0.5, 1) forwards;
    }

    .dropped-capsule::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.9);
      transform: translateY(-50%);
    }

    .dropped-capsule.show {
      display: block;
    }

    @keyframes dropBounce {
      0% { transform: translateY(-70px) scale(0.7); opacity: 0; }
      70% { transform: translateY(6px) scale(1.05); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* 결과 확인 팝업 모달 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(65, 45, 65, 0.55);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .result-card {
      width: 100%;
      max-width: 340px;
      background: #ffffff;
      border-radius: 30px;
      padding: 24px 20px;
      text-align: center;
      border: 4px solid #ffc8df;
      box-shadow: 0 20px 45px rgba(80, 45, 75, 0.3);
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .result-badge {
      display: inline-block;
      background: #fff0f6;
      color: #d64b86;
      font-size: 12px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .result-img-wrap {
      width: 190px;
      height: 190px;
      margin: 0 auto 14px;
      border-radius: 22px;
      background: #faf7ff;
      border: 2px solid #ece4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .result-img-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .result-name {
      font-size: 20px;
      font-weight: 800;
      color: #4f394e;
      margin-bottom: 18px;
      word-break: keep-all;
    }

    .close-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #ff8ab9, #b89cff);
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="machine-wrapper">
    <!-- 상단 포스터 영역 -->
    <div class="poster-box">
      <img id="posterImg" src="" alt="가챠 상단 포스터" />
    </div>

    <!-- 중앙 캡슐 돔 -->
    <div class="dome-area" id="domeArea">
      <div class="dome-highlight"></div>
      <div class="capsule-pool" id="capsulePool"></div>
    </div>

    <!-- 안내 메시지 -->
    <div class="status-bar" id="statusBar">왼쪽 코인 투입구를 눌러 코인을 넣어주세요!</div>

    <!-- 하단 3단 조작부 (코인투입구 | 손잡이 | 배출구) -->
    <div class="control-panel">
      <!-- 1. 코인 투입구 -->
      <div class="panel-col">
        <span class="panel-label">1. 코인 투입</span>
        <button type="button" class="coin-slot-btn" id="coinBtn" aria-label="코인 넣기">
          <div class="coin-hole"></div>
          <span class="coin-text" id="coinCountText">0 코인</span>
        </button>
      </div>

      <!-- 2. 가챠 손잡이 -->
      <div class="panel-col">
        <span class="panel-label">2. 손잡이 돌리기</span>
        <button type="button" class="crank-btn" id="crankBtn" aria-label="손잡이 돌리기">
          <div class="crank-bar">TURN</div>
        </button>
      </div>

      <!-- 3. 캡슐 배출구 -->
      <div class="panel-col">
        <span class="panel-label">3. 캡슐 열기</span>
        <div class="exit-box" id="exitBox" role="button" tabindex="0" aria-label="나온 캡슐 열기">
          <div class="exit-flap"></div>
          <div class="dropped-capsule" id="droppedCapsule"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 결과 확인 팝업 -->
  <div class="modal-backdrop" id="resultModal">
    <div class="result-card">
      <span class="result-badge">🎉 축하합니다!</span>
      <div class="result-img-wrap">
        <img id="resultImg" src="" alt="뽑힌 상품 이미지" />
      </div>
      <div class="result-name" id="resultName">상품 이름</div>
      <button type="button" class="close-btn" id="closeModalBtn">확인</button>
    </div>
  </div>

  <script>
    /* =================================================================
       [2] 상단 포스터 & 가챠 상품 설정 (여기만 수정해서 저장하면 친구에게도 적용됩니다!)
       ================================================================= */

    // 상단 포스터 이미지 주소 (원하는 이미지 직링크를 따옴표 안에 넣으세요)
    const POSTER_IMAGE_URL = "https://placehold.co/800x350/ffd6e7/7a4b63?text=MY+PASTEL+GACHA";

    // 가챠 상품 목록 (원하는 만큼 줄을 추가하거나 수정하세요)
    const REWARDS = [
      {
        name: "딸기 우유 키링",
        img: "https://placehold.co/400x400/ffdce8/7a4b63?text=Reward+1"
      },
      {
        name: "라벤더 구름 스티커",
        img: "https://placehold.co/400x400/e5dcff/594a7a?text=Reward+2"
      },
      {
        name: "소다 캔디 아크릴 스탠드",
        img: "https://placehold.co/400x400/d9f2ff/3d647a?text=Reward+3"
      },
      {
        name: "레몬 푸딩 배지",
        img: "https://placehold.co/400x400/fff5cc/7a6a38?text=Reward+4"
      }
    ];

    /* =================================================================
       [3] 이하 동작 로직 (수정하지 않으셔도 됩니다)
       ================================================================= */
    const PASTEL_COLORS = [
      "linear-gradient(180deg, #ff9ec6 50%, #ffffff 50%)",
      "linear-gradient(180deg, #b8a6ff 50%, #ffffff 50%)",
      "linear-gradient(180deg, #8fd8ff 50%, #ffffff 50%)",
      "linear-gradient(180deg, #ffe08a 50%, #ffffff 50%)",
      "linear-gradient(180deg, #9ce8c8 50%, #ffffff 50%)"
    ];

    let coins = 0;
    let isSpinning = false;
    let pendingReward = null;

    const posterImg = document.getElementById("posterImg");
    const domeArea = document.getElementById("domeArea");
    const capsulePool = document.getElementById("capsulePool");
    const statusBar = document.getElementById("statusBar");
    const coinBtn = document.getElementById("coinBtn");
    const coinCountText = document.getElementById("coinCountText");
    const crankBtn = document.getElementById("crankBtn");
    const exitBox = document.getElementById("exitBox");
    const droppedCapsule = document.getElementById("droppedCapsule");
    const resultModal = document.getElementById("resultModal");
    const resultImg = document.getElementById("resultImg");
    const resultName = document.getElementById("resultName");
    const closeModalBtn = document.getElementById("closeModalBtn");

    // 상단 포스터 적용
    posterImg.src = POSTER_IMAGE_URL;

    // 돔 안에 파스텔 캡슐 채우기
    function renderDomeCapsules() {
      capsulePool.innerHTML = "";
      const positions = [
        { left: "8%", bottom: "10px", rot: -15 },
        { left: "22%", bottom: "14px", rot: 20 },
        { left: "37%", bottom: "8px", rot: -8 },
        { left: "52%", bottom: "15px", rot: 32 },
        { left: "67%", bottom: "10px", rot: -24 },
        { left: "81%", bottom: "14px", rot: 12 },
        { left: "14%", bottom: "48px", rot: 28 },
        { left: "30%", bottom: "52px", rot: -18 },
        { left: "46%", bottom: "46px", rot: 14 },
        { left: "61%", bottom: "50px", rot: -28 },
        { left: "75%", bottom: "46px", rot: 22 },
        { left: "23%", bottom: "84px", rot: -12 },
        { left: "41%", bottom: "86px", rot: 25 },
        { left: "58%", bottom: "82px", rot: -20 }
      ];

      positions.forEach((pos, idx) => {
        const cap = document.createElement("div");
        cap.className = "deco-capsule";
        cap.style.left = pos.left;
        cap.style.bottom = pos.bottom;
        cap.style.transform = `rotate(${pos.rot}deg)`;
        cap.style.background = PASTEL_COLORS[idx % PASTEL_COLORS.length];
        capsulePool.appendChild(cap);
      });
    }

    // 효과음 (Web Audio API)
    function playTone(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === "coin") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(987, ctx.currentTime);
          osc.frequency.setValueAtTime(1318, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        } else if (type === "crank") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(260, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(420, ctx.currentTime + 0.35);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        } else if (type === "pop") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(523, ctx.currentTime);
          osc.frequency.setValueAtTime(659, ctx.currentTime + 0.09);
          osc.frequency.setValueAtTime(784, ctx.currentTime + 0.18);
          gain.gain.setValueAtTime(0.14, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.38);
          osc.start();
          osc.stop(ctx.currentTime + 0.38);
        }
      } catch (e) {}
    }

    // 1. 코인 넣기
    coinBtn.addEventListener("click", () => {
      if (isSpinning) return;
      coins += 1;
      coinCountText.textContent = `${coins} 코인`;
      playTone("coin");
      if (!pendingReward) {
        statusBar.textContent = "가운데 손잡이(TURN)를 눌러 돌려주세요!";
      }
    });

    // 2. 손잡이 돌리기
    crankBtn.addEventListener("click", () => {
      if (isSpinning) return;

      if (pendingReward) {
        statusBar.textContent = "오른쪽 배출구의 캡슐을 먼저 눌러 열어주세요!";
        return;
      }

      if (coins <= 0) {
        statusBar.textContent = "코인이 부족해요! 왼쪽 투입구를 먼저 눌러주세요.";
        return;
      }

      coins -= 1;
      coinCountText.textContent = `${coins} 코인`;
      isSpinning = true;
      statusBar.textContent = "달그락달그락... 캡슐이 섞이고 있어요!";
      playTone("crank");

      crankBtn.classList.add("turning");
      domeArea.classList.add("shaking");

      setTimeout(() => {
        crankBtn.classList.remove("turning");
        domeArea.classList.remove("shaking");

        const randomIndex = Math.floor(Math.random() * REWARDS.length);
        pendingReward = REWARDS[randomIndex];

        const randomColor = PASTEL_COLORS[Math.floor(Math.random() * PASTEL_COLORS.length)];
        droppedCapsule.style.background = randomColor;
        droppedCapsule.classList.add("show");

        isSpinning = false;
        statusBar.textContent = "캡슐이 나왔어요! 오른쪽 배출구 캡슐을 눌러보세요!";
      }, 750);
    });

    // 3. 배출구 캡슐 열기
    function openDroppedCapsule() {
      if (!pendingReward || isSpinning) return;
      playTone("pop");

      resultImg.src = pendingReward.img;
      resultName.textContent = pendingReward.name;
      resultModal.classList.add("open");

      droppedCapsule.classList.remove("show");
      pendingReward = null;
      statusBar.textContent = coins > 0
        ? "손잡이를 한 번 더 돌릴 수 있어요!"
        : "왼쪽 코인 투입구를 눌러 코인을 넣어주세요!";
    }

    exitBox.addEventListener("click", openDroppedCapsule);
    exitBox.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") openDroppedCapsule();
    });

    closeModalBtn.addEventListener("click", () => {
      resultModal.classList.remove("open");
    });

    resultModal.addEventListener("click", (e) => {
      if (e.target === resultModal) {
        resultModal.classList.remove("open");
      }
    });

    renderDomeCapsules();
  </script>
</body>
</html>
