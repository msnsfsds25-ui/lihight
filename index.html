<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>파스텔 가챠 머신</title>

  <!-- =================================================================
       [1] 카카오톡 공유 미리보기 설정 (원하는 내용으로 수정하세요)
       ================================================================= -->
  <meta property="og:title" content="두근두근 파스텔 가챠 뽑기!" />
  <meta property="og:description" content="코인을 넣고 손잡이를 돌려 오늘의 행운 캡슐을 뽑아보세요!" />
  <meta property="og:image" content="https://placehold.co/800x400/ffd6e7/7a4b63?text=Pastel+Gacha" />

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #fff5f9 0%, #f4f0ff 50%, #edf7ff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px 44px;
      color: #5a4659;
    }

    .page-wrap {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* 상단 포스터 배너 */
    .poster-card {
      width: 100%;
      aspect-ratio: 16 / 7;
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(135deg, #ffe3ef, #e8e3ff);
      border: 3px solid #ffc6df;
      box-shadow: 0 10px 24px rgba(210, 165, 198, 0.2);
    }

    .poster-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 가챠 머신 본체 */
    .machine-body {
      background: #ffffff;
      border-radius: 36px;
      padding: 18px;
      border: 4px solid #ffd6e8;
      box-shadow: 0 16px 36px rgba(205, 160, 195, 0.24);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 1. 상단 캡슐 돔 */
    .gacha-dome {
      position: relative;
      width: 100%;
      height: 225px;
      border-radius: 32px;
      background: radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.96), rgba(235, 246, 255, 0.78) 68%, rgba(224, 217, 255, 0.86));
      border: 4px solid #d7cfff;
      overflow: hidden;
      box-shadow: inset 0 -12px 22px rgba(180, 168, 240, 0.22);
    }

    .dome-gloss {
      position: absolute;
      top: 14px;
      left: 22px;
      width: 76px;
      height: 22px;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 50%;
      transform: rotate(-16deg);
      pointer-events: none;
      z-index: 2;
    }

    .dome-caps {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .cap-ball {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 4px 8px rgba(135, 115, 155, 0.16);
    }

    .cap-ball::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2.5px;
      background: rgba(255, 255, 255, 0.9);
      transform: translateY(-50%);
    }

    .gacha-dome.shaking .cap-ball {
      animation: capShake 0.35s ease-in-out infinite alternate;
    }

    @keyframes capShake {
      0% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(-5px, -12px) rotate(-22deg); }
      100% { transform: translate(5px, -7px) rotate(22deg); }
    }

    /* 상태 안내창 */
    .status-msg {
      background: #fff4f8;
      border: 2px dashed #ffb7d3;
      border-radius: 16px;
      padding: 10px 12px;
      text-align: center;
      font-size: 13.5px;
      font-weight: 700;
      color: #9e5274;
    }

    /* 2. 몸통 조작부: 코인투입구 | 큼직한 손잡이 (겹침 없음) */
    .body-deck {
      background: linear-gradient(180deg, #ffeaf2 0%, #ffd9e9 100%);
      border-radius: 26px;
      padding: 16px 14px;
      border: 3px solid #ffbdd9;
      display: grid;
      grid-template-columns: 110px 1fr;
      align-items: center;
      gap: 14px;
    }

    .coin-box {
      background: #ffffff;
      border: 3px solid #f4a6c6;
      border-radius: 20px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 0 #ed93b8;
    }

    .coin-slot-graphic {
      width: 12px;
      height: 36px;
      background: #583948;
      border-radius: 999px;
      border: 2px solid #d685a7;
    }

    .coin-badge {
      font-size: 14px;
      font-weight: 800;
      color: #b1527b;
    }

    .coin-add-btn {
      width: 100%;
      padding: 6px 6px;
      border: none;
      border-radius: 12px;
      background: #fff0f6;
      color: #b84b7a;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      border: 1.5px solid #ffc2dc;
    }

    .coin-add-btn:active {
      transform: translateY(2px);
    }

    .knob-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .knob-btn {
      width: 124px;
      height: 124px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff, #ffe2ee);
      border: 5px solid #ff9bc4;
      box-shadow: 0 7px 0 #ea81ae, 0 10px 16px rgba(185, 90, 134, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .knob-btn.turning {
      transform: rotate(360deg);
    }

    .knob-bar {
      width: 96px;
      height: 28px;
      background: linear-gradient(180deg, #ff84b6, #f2639f);
      border-radius: 999px;
      border: 3px solid #ffffff;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .knob-hint {
      font-size: 11.5px;
      font-weight: 700;
      color: #8b516c;
    }

    /* 3. 하단 큼직한 캡슐 배출구 */
    .dispenser-area {
      background: #f9f5ff;
      border: 3px solid #e2d8ff;
      border-radius: 24px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .dispenser-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .dispenser-title {
      font-size: 14px;
      font-weight: 800;
      color: #5b476e;
    }

    .dispenser-sub {
      font-size: 12px;
      color: #88779c;
      font-weight: 600;
    }

    .dispenser-hole {
      width: 118px;
      height: 86px;
      flex-shrink: 0;
      background: #6a4b63;
      border-radius: 20px;
      border: 4px solid #f4a6c6;
      box-shadow: inset 0 10px 16px rgba(30, 16, 28, 0.52);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }

    .out-capsule {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      display: none;
      position: relative;
      animation: outDrop 0.45s cubic-bezier(0.28, 1.45, 0.5, 1) forwards;
    }

    .out-capsule::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.92);
      transform: translateY(-50%);
    }

    .out-capsule.show {
      display: block;
    }

    @keyframes outDrop {
      0% { transform: translateY(-60px) scale(0.75); opacity: 0; }
      75% { transform: translateY(4px) scale(1.04); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* 보관함 */
    .locker-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 18px;
      border: 3px solid #e3dcff;
      box-shadow: 0 10px 24px rgba(175, 160, 215, 0.16);
    }

    .locker-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .locker-title {
      font-size: 16px;
      font-weight: 800;
      color: #5b476e;
    }

    .locker-count {
      font-size: 12px;
      font-weight: 800;
      color: #7d5fd3;
      background: #f2eeff;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .locker-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .locker-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 20px 10px;
      font-size: 13px;
      color: #9687a6;
      background: #faf8ff;
      border-radius: 16px;
    }

    .locker-slot {
      background: #faf8ff;
      border: 2px solid #ebe4ff;
      border-radius: 16px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .locker-slot img {
      width: 68px;
      height: 68px;
      object-fit: contain;
      border-radius: 12px;
      background: #ffffff;
    }

    .locker-slot span {
      font-size: 11.5px;
      font-weight: 700;
      color: #5a4659;
      text-align: center;
      line-height: 1.25;
      word-break: keep-all;
    }

    /* 결과 모달 */
    .popup-bg {
      position: fixed;
      inset: 0;
      background: rgba(62, 42, 62, 0.55);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 300;
    }

    .popup-bg.open {
      display: flex;
    }

    .popup-card {
      width: 100%;
      max-width: 340px;
      background: #ffffff;
      border-radius: 28px;
      padding: 22px 20px;
      text-align: center;
      border: 4px solid #ffc7de;
      box-shadow: 0 18px 40px rgba(75, 42, 70, 0.28);
    }

    .popup-badge {
      display: inline-block;
      background: #fff0f6;
      color: #d44984;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .popup-img-box {
      width: 190px;
      height: 190px;
      margin: 0 auto 14px;
      border-radius: 20px;
      background: #faf7ff;
      border: 2px solid #ece4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .popup-img-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .popup-name {
      font-size: 19px;
      font-weight: 800;
      color: #4d374c;
      margin-bottom: 16px;
      word-break: keep-all;
    }

    .popup-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 15px;
      background: linear-gradient(135deg, #ff89b8, #b69aff);
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="page-wrap">
    <!-- 상단 포스터 -->
    <div class="poster-card">
      <img id="posterImg" src="" alt="가챠 상단 포스터" />
    </div>

    <!-- 가챠 기계 -->
    <div class="machine-body">
      <div class="gacha-dome" id="gachaDome">
        <div class="dome-gloss"></div>
        <div class="dome-caps" id="domeCaps"></div>
      </div>

      <div class="status-msg" id="statusMsg">손잡이를 돌려 캡슐을 뽑아보세요!</div>

      <div class="body-deck">
        <div class="coin-box">
          <div class="coin-slot-graphic"></div>
          <div class="coin-badge" id="coinBadge">28 코인</div>
          <button type="button" class="coin-add-btn" id="coinAddBtn">+ 코인 추가</button>
        </div>

        <div class="knob-wrap">
          <button type="button" class="knob-btn" id="knobBtn" aria-label="가챠 손잡이 돌리기">
            <div class="knob-bar">TURN</div>
          </button>
          <span class="knob-hint">돌려서 뽑기</span>
        </div>
      </div>

      <div class="dispenser-area">
        <div class="dispenser-info">
          <div class="dispenser-title">캡슐 배출구</div>
          <div class="dispenser-sub" id="dispenserSub">캡슐이 떨어지면 눌러서 열어보세요</div>
        </div>
        <div class="dispenser-hole" id="dispenserHole" role="button" tabindex="0" aria-label="배출구 캡슐 열기">
          <div class="out-capsule" id="outCapsule"></div>
        </div>
      </div>
    </div>

    <!-- 보관함 -->
    <section class="locker-card">
      <div class="locker-top">
        <h2 class="locker-title">🎒 내 보관함</h2>
        <span class="locker-count" id="lockerCount">0개</span>
      </div>
      <div class="locker-grid" id="lockerGrid">
        <div class="locker-empty">아직 뽑은 캡슐이 없어요. 가챠를 돌려보세요!</div>
      </div>
    </section>
  </div>

  <!-- 결과 확인 팝업 -->
  <div class="popup-bg" id="popupBg">
    <div class="popup-card">
      <span class="popup-badge">✨ 획득 완료!</span>
      <div class="popup-img-box">
        <img id="popupImg" src="" alt="뽑힌 상품 이미지" />
      </div>
      <div class="popup-name" id="popupName">상품명</div>
      <button type="button" class="popup-btn" id="popupBtn">확인</button>
    </div>
  </div>

  <script>
    /* =================================================================
       [2] 기본 코인 · 상단 포스터 · 상품 설정 (여기서 수정하면 친구에게도 적용됩니다)
       ================================================================= */

    // 기본 시작 코인 개수 (기본 28개)
    const INITIAL_COINS = 28;

    // 상단 포스터 이미지 주소
    const POSTER_IMAGE_URL = "https://placehold.co/800x350/ffd6e7/7a4b63?text=MY+PASTEL+GACHA";

    // 가챠 상품 목록 (name: 상품명, img: 결과 이미지 주소)
    const REWARDS = [
      {
        name: "딸기 우유 키링",
        img: "https://placehold.co/400x400/ffdce8/7a4b63?text=Reward+1"
      },
      {
        name: "라벤더 구름 스티커",
        img: "https://placehold.co/400x400/e5dcff/594a7a?text=Reward+2"
      },
      {
        name: "소다 캔디 아크릴 스탠드",
        img: "https://placehold.co/400x400/d9f2ff/3d647a?text=Reward+3"
      },
      {
        name: "레몬 푸딩 배지",
        img: "https://placehold.co/400x400/fff5cc/7a6a38?text=Reward+4"
      }
    ];

    /* =================================================================
       [3] 가챠 동작 & 도르륵 소리 & 보관함 로직
       ================================================================= */
    const CAP_COLORS = [
      "linear-gradient(180deg, #ff9ec6 50%, #ffffff 50%)",
      "linear-gradient(180deg, #b8a6ff 50%, #ffffff 50%)",
      "linear-gradient(180deg, #8fd8ff 50%, #ffffff 50%)",
      "linear-gradient(180deg, #ffe08a 50%, #ffffff 50%)",
      "linear-gradient(180deg, #9ce8c8 50%, #ffffff 50%)"
    ];

    let coins = INITIAL_COINS;
    let isSpinning = false;
    let pendingReward = null;
    let myItems = [];

    const posterImg = document.getElementById("posterImg");
    const gachaDome = document.getElementById("gachaDome");
    const domeCaps = document.getElementById("domeCaps");
    const statusMsg = document.getElementById("statusMsg");
    const coinBadge = document.getElementById("coinBadge");
    const coinAddBtn = document.getElementById("coinAddBtn");
    const knobBtn = document.getElementById("knobBtn");
    const dispenserSub = document.getElementById("dispenserSub");
    const dispenserHole = document.getElementById("dispenserHole");
    const outCapsule = document.getElementById("outCapsule");
    const lockerCount = document.getElementById("lockerCount");
    const lockerGrid = document.getElementById("lockerGrid");
    const popupBg = document.getElementById("popupBg");
    const popupImg = document.getElementById("popupImg");
    const popupName = document.getElementById("popupName");
    const popupBtn = document.getElementById("popupBtn");

    posterImg.src = POSTER_IMAGE_URL;
    coinBadge.textContent = `${coins} 코인`;

    function buildDomeCaps() {
      domeCaps.innerHTML = "";
      const coords = [
        { left: "8%", bottom: "10px", rot: -15 },
        { left: "22%", bottom: "14px", rot: 18 },
        { left: "37%", bottom: "8px", rot: -10 },
        { left: "52%", bottom: "15px", rot: 28 },
        { left: "67%", bottom: "10px", rot: -22 },
        { left: "81%", bottom: "14px", rot: 12 },
        { left: "15%", bottom: "48px", rot: 24 },
        { left: "31%", bottom: "52px", rot: -16 },
        { left: "47%", bottom: "46px", rot: 14 },
        { left: "62%", bottom: "50px", rot: -25 },
        { left: "76%", bottom: "46px", rot: 20 },
        { left: "24%", bottom: "84px", rot: -12 },
        { left: "42%", bottom: "86px", rot: 22 },
        { left: "58%", bottom: "82px", rot: -18 }
      ];

      coords.forEach((c, idx) => {
        const div = document.createElement("div");
        div.className = "cap-ball";
        div.style.left = c.left;
        div.style.bottom = c.bottom;
        div.style.transform = `rotate(${c.rot}deg)`;
        div.style.background = CAP_COLORS[idx % CAP_COLORS.length];
        domeCaps.appendChild(div);
      });
    }

    function playSound(type) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        if (type === "coin") {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "sine";
          osc.frequency.setValueAtTime(987.77, now);
          osc.frequency.setValueAtTime(1318.51, now + 0.08);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === "rattle") {
          const clicks = 9;
          for (let i = 0; i < clicks; i++) {
            const t = now + i * 0.075;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = "triangle";
            osc.frequency.setValueAtTime(240 + i * 28, t);
            osc.frequency.exponentialRampToValueAtTime(140, t + 0.045);
            gain.gain.setValueAtTime(0.13, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
            osc.start(t);
            osc.stop(t + 0.055);
          }
        } else if (type === "pop") {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "sine";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.36);
        }
      } catch (err) {}
    }

    function renderLocker() {
      lockerCount.textContent = `${myItems.length}개`;
      if (myItems.length === 0) {
        lockerGrid.innerHTML = `<div class="locker-empty">아직 뽑은 캡슐이 없어요. 가챠를 돌려보세요!</div>`;
        return;
      }

      lockerGrid.innerHTML = "";
      myItems.forEach((item) => {
        const slot = document.createElement("div");
        slot.className = "locker-slot";
        slot.innerHTML = `
          <img src="${item.img}" alt="${item.name}" />
          <span>${item.name}</span>
        `;
        slot.addEventListener("click", () => {
          popupImg.src = item.img;
          popupName.textContent = item.name;
          popupBg.classList.add("open");
        });
        lockerGrid.appendChild(slot);
      });
    }

    coinAddBtn.addEventListener("click", () => {
      if (isSpinning) return;
      coins += 1;
      coinBadge.textContent = `${coins} 코인`;
      playSound("coin");
      if (!pendingReward) {
        statusMsg.textContent = "코인이 추가됐어요! 손잡이를 돌려보세요.";
      }
    });

    knobBtn.addEventListener("click", () => {
      if (isSpinning) return;

      if (pendingReward) {
        statusMsg.textContent = "아래 배출구 캡슐을 먼저 눌러 열어주세요!";
        return;
      }

      if (coins <= 0) {
        statusMsg.textContent = "코인이 다 떨어졌어요! 왼쪽에서 코인을 추가해 보세요.";
        return;
      }

      coins -= 1;
      coinBadge.textContent = `${coins} 코인`;
      isSpinning = true;
      statusMsg.textContent = "도르륵... 캡슐이 섞이고 있어요!";
      dispenserSub.textContent = "캡슐이 굴러오는 중...";
      playSound("rattle");

      knobBtn.classList.add("turning");
      gachaDome.classList.add("shaking");

      setTimeout(() => {
        knobBtn.classList.remove("turning");
        gachaDome.classList.remove("shaking");

        const picked = REWARDS[Math.floor(Math.random() * REWARDS.length)];
        pendingReward = { ...picked };

        outCapsule.style.background = CAP_COLORS[Math.floor(Math.random() * CAP_COLORS.length)];
        outCapsule.classList.add("show");

        isSpinning = false;
        statusMsg.textContent = "캡슐이 나왔어요! 오른쪽 배출구 캡슐을 눌러보세요!";
        dispenserSub.textContent = "캡슐을 눌러 상품을 확인하세요!";
      }, 750);
    });

    function openOutCapsule() {
      if (!pendingReward || isSpinning) return;
      playSound("pop");

      popupImg.src = pendingReward.img;
      popupName.textContent = pendingReward.name;
      popupBg.classList.add("open");

      myItems.unshift(pendingReward);
      renderLocker();

      outCapsule.classList.remove("show");
      pendingReward = null;
      dispenserSub.textContent = "캡슐이 떨어지면 눌러서 열어보세요";
      statusMsg.textContent = coins > 0
        ? "보관함에 저장됐어요! 또 돌려보세요."
        : "코인이 없어요! 왼쪽에서 코인을 추가해 보세요.";
    }

    dispenserHole.addEventListener("click", openOutCapsule);
    dispenserHole.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") openOutCapsule();
    });

    popupBtn.addEventListener("click", () => {
      popupBg.classList.remove("open");
    });

    popupBg.addEventListener("click", (e) => {
      if (e.target === popupBg) {
        popupBg.classList.remove("open");
      }
    });

    buildDomeCaps();
    renderLocker();
  </script>
</body>
</html>
